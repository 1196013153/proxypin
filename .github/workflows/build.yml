name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps & l10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload.jks
            cat > key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "::warning::No signing secrets configured, generating an ephemeral CI keystore"
            keytool -genkeypair -v -keystore app/ci.jks -alias proxypin -storepass proxypin123 -keypass proxypin123 \
              -dname "CN=ProxyPin CI,O=leaf,C=CN" -keyalg RSA -keysize 2048 -validity 36500
            cat > key.properties <<EOF
          storeFile=ci.jks
          storePassword=proxypin123
          keyAlias=proxypin
          keyPassword=proxypin123
          EOF
          fi

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-android-apk
          path: build/app/outputs/**/proxypin-android-*.apk
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 构建成功即发布 Release：tag 取 pubspec 版本(v<version>)，
      # 同版本重复构建覆盖产物；上游升版本后会自动生成新 Release。
      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          APK=$(find build/app/outputs -name 'proxypin-android-*.apk' | head -1)
          NOTES="自动构建：commit ${GITHUB_SHA::7}，$(date -u '+%Y-%m-%d %H:%M UTC')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "ProxyPin $VERSION" --notes "$NOTES"
          fi
