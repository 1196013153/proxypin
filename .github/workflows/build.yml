name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps & l10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload.jks
            cat > key.properties <<EOF
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "::warning::No signing secrets configured, generating an ephemeral CI keystore"
            keytool -genkeypair -v -keystore app/ci.jks -alias proxypin -storepass proxypin123 -keypass proxypin123 \
              -dname "CN=ProxyPin CI,O=leaf,C=CN" -keyalg RSA -keysize 2048 -validity 36500
            cat > key.properties <<EOF
          storeFile=ci.jks
          storePassword=proxypin123
          keyAlias=proxypin
          keyPassword=proxypin123
          EOF
          fi

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-android-apk
          path: build/app/outputs/**/proxypin-android-*.apk
          if-no-files-found: error

      - name: Attach APK to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/**/proxypin-android-*.apk
