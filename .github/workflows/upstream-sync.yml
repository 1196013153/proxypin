name: upstream-sync

on:
  schedule:
    # 每日 UTC 21:23（本地约凌晨/清晨），错开整点
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.sync.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/wanghongenpin/proxypin.git
          git fetch upstream main --tags

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "local is $BEHIND commits behind upstream, $AHEAD ahead"

          # 同步成功/已是最新时，把遗留的冲突 issue 都关掉（避免 issue 长期挂着）
          close_issues() {
            local reason="$1"
            gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-sync --state open \
              --json number --jq '.[].number' 2>/dev/null | while read -r n; do
                [ -n "$n" ] || continue
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                  --comment "已自动同步（$reason），关闭。" || true
              done
          }

          if [ "$BEHIND" = "0" ]; then
            echo "up to date, nothing to do"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            close_issues "上游无新提交"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            git push origin main
            SHA=$(git rev-parse --short HEAD)
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            close_issues "合并提交 $SHA"
            exit 0
          fi

          # 冲突：放弃自动合并，写清理后的冲突文件清单到 issue，交给人工处理
          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          git merge --abort || true
          echo "merged=conflict" >> "$GITHUB_OUTPUT"
          {
            echo "upstream/main 有新提交（$BEHIND 个），但与本地改动冲突，无法自动合并。"
            echo ""
            echo "**冲突文件**："
            echo '```'
            printf '%s\n' "$CONFLICTS"
            echo '```'
            echo ""
            echo "本地处理方式：\`git fetch origin && git merge upstream/main\`，解冲突后 push（CI 会自动出包）。"
            echo ""
            echo "<details><summary>与上游有差异的文件（前 50 个）</summary>"
            echo ""
            echo '```'
            git diff --name-only HEAD upstream/main | head -50
            echo '```'
            echo ""
            echo "</details>"
          } > body.md

          # 复用同一个 issue：标签存在时用它筛，避免每天刷一条新 issue
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-sync --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file body.md \
              || echo "::warning::追加 issue #$EXISTING 失败"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "上游同步冲突（待人工合并）" \
              --label "upstream-sync" \
              --body-file body.md \
              || gh issue create --repo "$GITHUB_REPOSITORY" \
                   --title "上游同步冲突（待人工合并）" \
                   --body-file body.md \
              || echo "::warning::创建 issue 失败"
          fi

          # 冲突属于"需要人处理"的已知状态，用 warning 标注即可，
          # 不再让每日定时任务标红（避免天天失败通知，实际进度看 issue）
          echo "::warning::上游同步冲突，已记录到 issue，等待人工合并"
          exit 0

  build:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/build.yml
    # 复用工作流默认拿不到调用方的 Secrets，必须显式 inherit，
    # 否则 build.yml 里 ANDROID_KEYSTORE_* 为空 → 退回一次性 keystore → 签名不一致。
    secrets: inherit