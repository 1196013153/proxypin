name: upstream-sync

on:
  schedule:
    # 每日 UTC 21:23（本地约凌晨/清晨），错开整点
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.sync.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/wanghongenpin/proxypin.git
          git fetch upstream main --tags

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "local is $BEHIND commits behind upstream, $AHEAD ahead"

          if [ "$BEHIND" = "0" ]; then
            echo "up to date, nothing to do"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            git push origin main
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "upstream/main 有新提交($BEHIND 个)，但与本地改动冲突，无法自动合并。"
              echo "冲突热点文件: \`search_model.dart\`、\`desktop/mobile request.dart\`、\`l10n/*.arb\` 等。"
              echo "请人工拉取后在本机执行: git fetch origin && git merge upstream/main"
              echo ""
              echo "<details><summary>与上游有差异的文件</summary>"
              echo ""
              echo '```'
              git diff --name-only HEAD upstream/main | head -50
              echo '```'
              echo ""
              echo "</details>"
            } > body.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "上游同步冲突 $(date +%F)" \
              --label "upstream-sync" \
              --body-file body.md || \
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "上游同步冲突 $(date +%F)" \
              --body-file body.md
            exit 1
          fi

  build:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.github/workflows/build.yml
